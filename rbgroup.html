<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RB Group Admin Panel</title>
    <link rel="stylesheet" href="rbgroup.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo-container">
                <img src="./image/R.B.png" alt="RB Group of Companies">
            </div>
            <ul class="sidebar-menu">
                <li><a href="./attendance/attendance.html"><i class="fas fa-clipboard-list"></i><span>Attendance</span></a></li>
                <li><a href="#employee"><i class="fas fa-users"></i><span>Employee</span></a></li>
                <li><a href="#sales"><i class="fas fa-chart-line"></i><span>Daily Sales</span></a></li>
                <li><a href="#billing"><i class="fas fa-file-invoice"></i><span>Billing</span></a></li>
                <li><a href="#warehouse"><i class="fas fa-warehouse"></i><span>Warehouse</span></a></li>
                <li><a href="#reports"><i class="fas fa-chart-bar"></i><span>Reports</span></a></li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="cards-container">
                <div class="card" onclick="location.href='./attendance/attendance.html'">
                    <i class="fas fa-clipboard-list"></i>
                    <h3>Attendance</h3>
                </div>
                <div class="card" onclick="location.href='#employee'">
                    <i class="fas fa-users"></i>
                    <h3>Employee</h3>
                </div>
                <div class="card" onclick="location.href='#sales'">
                    <i class="fas fa-chart-line"></i>
                    <h3>Daily Sales</h3>
                </div>
                <div class="card" onclick="location.href='#billing'">
                    <i class="fas fa-file-invoice"></i>
                    <h3>Billing</h3>
                </div>
                <div class="card" onclick="location.href='#warehouse'">
                    <i class="fas fa-warehouse"></i>
                    <h3>Warehouse</h3>
                </div>
                <div class="card" onclick="location.href='#reports'">
                    <i class="fas fa-chart-bar"></i>
                    <h3>Reports</h3>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('click', function() {
                console.log('Navigating to:', this.querySelector('h3').textContent);
            });
        });

        document.querySelectorAll('.sidebar-menu a').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                console.log('Navigating to:', this.querySelector('span').textContent);
            });
        });
    </script>
</body>
</html>
