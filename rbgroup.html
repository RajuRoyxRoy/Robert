<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>RB Group Admin Panel</title>
        <link rel="stylesheet" href="rbgroup.css">
    </head>
    <body>
        <div class="container">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="logo-container">
                    <img src="./image/R.B.png" alt="RB Group of Companies">
                </div>
                <ul class="sidebar-menu">
                    <li><a href="./attendance/attendance.html"><i
                                class="fas fa-clipboard-list"></i><span>Attendance</span></a></li>
                    <li><a href="./employeema/index.html"><i
                                class="fas fa-users"></i><span>Employee</span></a></li>
                    <li><a href="#sales"><i
                                class="fas fa-chart-line"></i><span>Daily
                                Sales</span></a></li>
                    <li><a href="#billing"><i
                                class="fas fa-file-invoice"></i><span>Billing</span></a></li>
                    <li><a href="#warehouse"><i
                                class="fas fa-warehouse"></i><span>Warehouse</span></a></li>
                    <li><a href="#reports"><i
                                class="fas fa-chart-bar"></i><span>Reports</span></a></li>
                </ul>
            </div>

            <!-- Main Content -->
            <div class="main-content">
                <div class="header">
                    <div class="search">
                        
                            <i class="fa fa-search"></i>
                            <input type="search" name="search" id="search"
                                placeholder="Search...">
                     
                        <button>Search</button>
                    </div>
                    <div class="profile">
                        <div class="profile-avatar"><i class="fa fa-user-o" aria-hidden="true" style="color: black;"></i></div>
                        <div class="name">Alex Arnold</div>
                    </div>
                </div>
                <div class="dashboard-text">
                    <h1>Welcome to the Dashboard</h1>
                    <p>Look at your company perfomance </p>
                </div>
                <div class="cards-container">
                    <div class="card"
                        onclick="location.href='./attendance/attendance.html'">
                        <div class="icon" style="background-color: #cfffc0;"><i class="fas fa-clipboard-list"></i></div>
                        <h3>Attendance</h3>
                    </div>
                    <div class="card"
                        onclick="location.href='./employeema/index.html'">
                        <div class="icon" style="background-color: #ACDDDE;"><i class="fas fa-users"></i></div>
                        <h3>Employee</h3>
                    </div>
                    <div class="card" onclick="location.href='#sales'">
                        <div class="icon" style="background-color: #DFD6F6;"><i class="fas fa-chart-line"></i></div>
                        <h3>Daily Sales</h3>
                    </div>
                    <div class="card" onclick="location.href='#billing'">
                       <div class="icon" style="background-color: #eedd82;"> <i class="fas fa-file-invoice"></i></div>
                        <h3>Billing</h3>
                    </div>
                    <div class="card" onclick="location.href='#warehouse'">
                        <div class="icon" style="background-color: #82cda8;"><i class="fas fa-warehouse"></i></div>
                        <h3>Warehouse</h3>
                    </div>
                    <div class="card" onclick="location.href='#reports'">
                        <div class="icon" style="background-color: #f5beff;"><i class="fas fa-chart-bar"></i></div>
                        <h3>Reports</h3>
                    </div>
                </div>
            </div>
        </div>

        <script>
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('click', function() {
                console.log('Navigating to:', this.querySelector('h3').textContent);
            });
        });

        document.querySelectorAll('.sidebar-menu a').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                console.log('Navigating to:', this.querySelector('span').textContent);
            });
        });
    </script>
    </body>
</html>
