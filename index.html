<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Company Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-container">
    <img src="./image/R.B.png" alt="RB Logo" class="logo">
    <h2>LOGIN TO YOUR ACCOUNT</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="company">Select Company:</label>
            <select name="company" id="company" required>
                <option value="" disabled selected>Select your company</option>
                <option value="admin">Admin</option>
                <option value="rb_motors">RB Motors</option>
                <option value="rb_station">RB Station</option>
                <option value="sb_station">SB Station</option>
            </select>
        </div>

        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="login-button">LOGIN</button>
    </form>
    <div id="message" style="margin-top: 20px; color: red;"></div>
</div>

<!-- Link to the external JavaScript file -->
<script src="login.js"></script>

</body>
</html>
